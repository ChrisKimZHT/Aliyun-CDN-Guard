[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aliyun-cdn-guard"
version = "0.1.0"
description = "Block abusive Alibaba Cloud CDN clients from SLS real-time access logs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alibabacloud-cdn20180510>=9.2,<10",
  "alibabacloud-credentials>=1.0.12,<2",
  "aliyun-log-python-sdk>=0.9.51,<1",
  "loguru>=0.7,<1",
  "python-dotenv>=1.2,<2",
  "PyYAML>=6.0,<7",
]

[project.scripts]
aliyun-cdn-guard = "aliyun_cdn_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
